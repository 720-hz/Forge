<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4ff6a"/>
      <stop offset="100%" stop-color="#a3cc1f"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- subtle ring -->
  <circle cx="512" cy="512" r="360" fill="none" stroke="#d4ff3a" stroke-width="3" opacity="0.12"/>

  <!-- The F mark, geometric and bold -->
  <g filter="url(#glow)">
    <!-- vertical stem -->
    <rect x="356" y="300" width="92" height="424" rx="20" fill="url(#lime)"/>
    <!-- top bar -->
    <rect x="356" y="300" width="312" height="92" rx="20" fill="url(#lime)"/>
    <!-- middle bar -->
    <rect x="356" y="468" width="232" height="88" rx="20" fill="url(#lime)"/>
  </g>

  <!-- energy spark dot -->
  <circle cx="700" cy="724" r="40" fill="url(#lime)" filter="url(#glow)"/>
</svg>
